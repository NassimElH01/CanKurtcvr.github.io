  <!-- ═════════════════════════ 1. DESIGN ═════════════════════════ -->
  <style>
/*
 * 24Support julekalender 2026 – styling
 * =====================================
 * Farver og typografi samles som variabler herunder, så de nemt kan
 * tilpasses 24Supports brand. Alle mål inde i scenen bruger "cqw"
 * (procent af scenens bredde), så kalenderen skalerer ens på alle skærme.
 */

:root {
  --night-top: #0A1733;      /* himmel, øverst */
  --night-bottom: #1D3A6B;   /* himmel, nederst */
  --house-red: #9C2A33;
  --house-blue: #2A5A92;
  --shutter-on-red: #1F4274; /* låger på røde huse er blå */
  --shutter-on-blue: #8C2530;/* låger på blå huse er røde */
  --cream: #F4ECDD;          /* rammer, tal, kort */
  --warm: #FFC56A;           /* varmt lys */
  --gold: #E7B24C;           /* dagens låge og "åbnet"-mærke */
  --snow: #F3F7FC;
  --ink: #14233F;            /* tekst på kortet */

  --font-numbers: "Young Serif", Georgia, "Times New Roman", serif;
  --font-text: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  /* Gennemsigtig baggrund, så kalenderen kan ligge som overlay i en iframe. */
  background: transparent;
}

body {
  display: grid;
  place-items: center;
  overflow: hidden;
  font-family: var(--font-text);
}

/* ---------- Scenen (16:9) ---------- */

.stage {
  position: relative;
  /* Så stor som muligt, men altid 16:9 og altid inden for vinduet. */
  width: min(100vw, calc(100vh * 16 / 9));
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 1.2cqw;
  container-type: inline-size;
  background: var(--night-top);
  box-shadow: 0 1.5cqw 4cqw rgba(5, 12, 30, 0.35);
  isolation: isolate;
}

.scenery,
.snow,
.doors {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* ---------- Snefald ---------- */

.snow { pointer-events: none; z-index: 1; }

.flake {
  position: absolute;
  top: -2%;
  border-radius: 50%;
  background: var(--snow);
  opacity: 0.5;
  animation: fall linear infinite;
}

@keyframes fall {
  to { transform: translate3d(var(--drift, 0), 110cqh, 0); }
}

/* ---------- Låger ---------- */

.doors { z-index: 2; }

/*
 * Hver låge er en <button>. Positionen sættes inline i procent af scenen
 * af calendar.js, så den passer præcist over vinduet i SVG-baggrunden.
 */
.door {
  position: absolute;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  perspective: 40cqw;
  -webkit-tap-highlight-color: transparent;
}

/*
 * Usynlig udvidelse af trykfladen. Skodden ser ud som før, men fingeren
 * må ramme lidt ved siden af – vigtigt på mobil, hvor lågerne er små.
 */
.door::before {
  content: "";
  position: absolute;
  inset: -14%;
}

/* Skodden – den del der svinger op. */
.shutter {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  border: 0.22cqw solid var(--cream);
  border-radius: 0.3cqw;
  background-color: var(--shutter-color);
  /* Diskrete fyldninger, som på en træskodde. */
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.07), rgba(0, 0, 0, 0.12)),
    linear-gradient(var(--shutter-color), var(--shutter-color));
  box-shadow:
    inset 0 0 0 0.45cqw var(--shutter-color),
    inset 0 0 0 0.55cqw rgba(244, 236, 221, 0.35),
    0 0.25cqw 0.5cqw rgba(0, 0, 0, 0.35);
  transform-origin: left center;
  transition: transform 0.8s cubic-bezier(0.3, 0.7, 0.2, 1), filter 0.3s;
  backface-visibility: hidden;
}

.door[data-house="red"]  { --shutter-color: var(--shutter-on-red); }
.door[data-house="blue"] { --shutter-color: var(--shutter-on-blue); }

/* Låge 24 er ekstra festlig. */
.door[data-day="24"] { --shutter-color: #7A5A1E; }
.door[data-day="24"] .shutter { border-color: var(--gold); }

.num {
  font-family: var(--font-numbers);
  font-size: 3.1cqw;
  line-height: 1;
  color: var(--cream);
  text-shadow: 0 0.12cqw 0 rgba(0, 0, 0, 0.3);
  user-select: none;
}

/* Låst: lidt dæmpet, men tallet er stadig tydeligt. */
.door.is-locked { cursor: default; }
.door.is-locked .shutter { filter: saturate(0.6) brightness(0.78); }

/* Tilgængelig i dag: guldkant der pulserer roligt. */
.door.is-today .shutter {
  border-color: var(--gold);
  animation: glow 2.4s ease-in-out infinite;
}

@keyframes glow {
  0%, 100% { box-shadow: inset 0 0 0 0.45cqw var(--shutter-color), 0 0 0.4cqw 0.1cqw rgba(231, 178, 76, 0.45); }
  50%      { box-shadow: inset 0 0 0 0.45cqw var(--shutter-color), 0 0 1.4cqw 0.35cqw rgba(231, 178, 76, 0.75); }
}

/* Hover/fokus på låger der kan åbnes. */
.door:not(.is-locked):not(.is-opened):hover .shutter {
  transform: rotateY(-14deg);
}
.door:focus-visible { outline: none; }
.door:focus-visible .shutter,
.door.is-opened:focus-visible .opened-mark {
  outline: 0.25cqw solid var(--gold);
  outline-offset: 0.3cqw;
}

/* Åbnet: skodden svinger ud og det varme vindue kommer til syne. */
.door.is-opened .shutter {
  transform: rotateY(-108deg);
  box-shadow: none;
  animation: none;
}

/* "Åbnet"-mærke: lille guldstjerne på vinduet. */
.opened-mark {
  position: absolute;
  right: 8%;
  top: 6%;
  width: 34%;
  aspect-ratio: 1;
  background: var(--gold);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  filter: drop-shadow(0 0 0.3cqw rgba(255, 197, 106, 0.9));
  opacity: 0;
  transform: scale(0.4);
  transition: opacity 0.4s 0.5s, transform 0.4s 0.5s;
}
.door.is-opened .opened-mark { opacity: 1; transform: scale(1); }

/* Det lille tal der også står i det åbne vindue. */
.opened-num {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 8%;
  text-align: center;
  font-family: var(--font-numbers);
  font-size: 1.7cqw;
  color: #6B3B12;
  opacity: 0;
  transition: opacity 0.4s 0.5s;
}
.door.is-opened .opened-num { opacity: 0.85; }

/* Finale: når alle 24 låger er åbnet, tændes en stjerne over husene. */
#finale {
  opacity: 0;
  transition: opacity 2s ease-out;
}
.stage.is-complete #finale {
  opacity: 1;
  animation: twinkle 4s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.85; }
  50%      { opacity: 1; }
}

/* Låst låge rystes let ved klik. */
.door.shake .shutter { animation: shake 0.4s; }
@keyframes shake {
  20% { transform: translateX(-0.35cqw); }
  40% { transform: translateX(0.35cqw); }
  60% { transform: translateX(-0.2cqw); }
  80% { transform: translateX(0.2cqw); }
}

/* ---------- Spørgsmålskort ---------- */

/*
 * Kortet ligger uden for scenen (position: fixed), så det dækker hele
 * vinduet/iframen og har læsbar størrelse på både computer og mobil.
 */
.card-layer {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(6, 14, 34, 0.55);
  backdrop-filter: blur(4px);
  animation: fade 0.3s ease-out;
}
.card-layer[hidden] { display: none; }

@keyframes fade { from { opacity: 0; } }

.card {
  position: relative;
  width: min(640px, 100%);
  max-height: 100%;
  overflow-y: auto;
  padding: clamp(24px, 4vw, 48px) clamp(20px, 4vw, 52px) clamp(22px, 3.6vw, 44px);
  border-radius: 10px;
  background: var(--cream);
  color: var(--ink);
  border-top: clamp(6px, 0.8vw, 10px) solid var(--house-red);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  text-align: center;
  animation: rise 0.45s cubic-bezier(0.3, 0.7, 0.2, 1);
}

@keyframes rise { from { transform: translateY(24px) scale(0.97); opacity: 0; } }

.card-number {
  font-family: var(--font-numbers);
  font-size: clamp(44px, 7vw, 104px);
  line-height: 1;
  color: var(--house-red);
  margin-bottom: clamp(12px, 1.6vw, 22px);
}

.card-question {
  margin: 0 auto;
  max-width: 34em;
  font-size: clamp(16px, 1.8vw, 24px);
  line-height: 1.5;
  white-space: pre-line; /* bevarer linjeskift fra admin */
}

/* Vignet i stedet for tom plads, hvis en låge mangler sit spørgsmål. */
.card-ornament {
  display: none;
  width: clamp(40px, 5vw, 64px);
  height: auto;
  margin: 0 auto;
  stroke: var(--house-blue);
  stroke-width: 1.4;
  stroke-linecap: round;
  fill: none;
  opacity: 0.5;
}
.card.is-empty .card-question { display: none; }
.card.is-empty .card-ornament { display: block; }

.card-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 40px;
  height: 40px;
  padding: 9px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}
.card-close svg { width: 100%; height: 100%; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }
.card-close:hover { background: rgba(20, 35, 63, 0.08); }
.card-close:focus-visible { outline: 2px solid var(--house-blue); outline-offset: 2px; }

/* ---------- Reduceret bevægelse ---------- */

@media (prefers-reduced-motion: reduce) {
  .shutter, .opened-mark, .opened-num { transition: none; }
  .door.is-today .shutter, .door.shake .shutter, .card, .card-layer { animation: none; }
  .flake { display: none; }
}
  </style>

  <!--

  <script>
    /* Kalenderens indstillinger. */
    const CALENDAR_SETTINGS = {
      year: 2026,
      // Kun til forhåndsvisning: lad som om datoen er fx "2026-12-05".
      // Skal være tom ("") i den version, der lægges på hjemmesiden.
      testDate: /*TEST-DATE-START*/""/*TEST-DATE-END*/,
    };

    /* De 24 spørgsmål som base64-kodet JSON. Tom = ingen spørgsmål endnu. */
    const QUESTIONS_DATA = /*QUESTIONS-START*/""/*QUESTIONS-END*/;

  <!-- ═════════════════════════ 4. LOGIK ══════════════════════════ -->
  <script>
/*
 * 24Support julekalender 2026 – logik
 * ===================================
 *
 * Scriptet gør fire ting:
 *   1. Tegner baggrunden (himmel, fire huse, lygter, sne) som SVG.
 *   2. Placerer 24 låger præcist over husenes vinduer.
 *   3. Beregner ud fra dagens dato (dansk tid), hvilke låger der må åbnes,
 *      og læser spørgsmålene fra dataafsnittet øverst i filen.
 *   4. Husker i brugerens browser (localStorage), hvilke låger der er åbnet,
 *      og viser det med en åben skodde, varmt lys og en guldstjerne.
 *
 * Hele kompositionen er tegnet i et koordinatsystem på 1600 × 900 (16:9).
 * Lågerne placeres i procent af det, så de altid flugter med baggrunden.
 */
(function () {
  'use strict';

  /* ---------------------------------------------------------------------- */
  /* Konfiguration                                                           */
  /* ---------------------------------------------------------------------- */

  const YEAR = CALENDAR_SETTINGS.year;
  const TIME_ZONE = 'Europe/Copenhagen'; // lågerne åbner ved midnat dansk tid
  const STORAGE_KEY = `24support-julekalender-${YEAR}-aabnet`;
  const REFRESH_MS = 60 * 1000;          // tjek datoen hvert minut (til midnat)

  const VIEW_W = 1600;
  const VIEW_H = 900;

  /*
   * Husene fra venstre mod højre. "style" er gavltypen:
   *   "gable"   = almindelig spids gavl med tag
   *   "stepped" = trappegavl (klassisk dansk købstadshus)
   */
  const HOUSES = [
    { color: 'red',  style: 'stepped' },
    { color: 'blue', style: 'gable' },
    { color: 'red',  style: 'gable' },
    { color: 'blue', style: 'stepped' },
  ];

  const HOUSE = {
    firstX: 110,   // venstre kant af første hus
    width: 300,
    spacing: 360,  // afstand mellem husenes venstre kanter
    top: 250,      // facadens top (under gavlen)
    bottom: 830,
  };

  const WINDOW = {
    width: 90,
    height: 120,
    colOffsets: [40, 170], // x i forhold til husets venstre kant
    rows: [300, 470, 640], // y for de tre etager
  };

  /*
   * Lågernes numre i vinduesrækkefølge: hus for hus, etage for etage,
   * venstre før højre. Numrene er spredt som på en klassisk kalender.
   * Byt rundt her, hvis I ønsker en anden fordeling.
   */
  const DOOR_ORDER = [
    7, 18, 3, 22, 12, 1,
    15, 9, 24, 5, 20, 11,
    2, 16, 10, 21, 6, 13,
    19, 4, 14, 8, 23, 17,
  ];

  const COLORS = {
    red:      { facade: '#9C2A33', roof: '#6A1B23', plinth: '#5E1920' },
    blue:     { facade: '#2A5A92', roof: '#1A3D6B', plinth: '#173559' },
    cream:    '#F4ECDD',
    snow:     '#F3F7FC',
    snowShade:'#C9D6EA',
    warm:     '#FFC56A',
    night:    '#0E1B33',
    tree:     '#123C33',
  };

  /* ---------------------------------------------------------------------- */
  /* Tilstand                                                                */
  /* ---------------------------------------------------------------------- */

  const state = {
    today: 0,              // antal låger der må åbnes i dag (0–24)
    questions: decodeQuestions(QUESTIONS_DATA), // { "1": "Spørgsmål ...", ... }
    opened: loadOpened(),  // Set med numre på låger brugeren har åbnet
    lastFocus: null,       // låge der skal have fokus igen, når kortet lukkes
  };

  const $ = (id) => document.getElementById(id);
  const scenery = $('scenery');
  const doorsLayer = $('doors');
  const cardLayer = $('cardLayer');
  const doorEls = new Map(); // dag -> <button>

  /* ---------------------------------------------------------------------- */
  /* Hukommelse i browseren                                                  */
  /* ---------------------------------------------------------------------- */

  function loadOpened() {
    try {
      const list = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      return new Set(list.filter((n) => Number.isInteger(n) && n >= 1 && n <= 24));
    } catch {
      return new Set(); // fx hvis browseren blokerer lagring
    }
  }

  function saveOpened() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...state.opened]));
    } catch {
      /* Lagring er ikke kritisk – kalenderen virker stadig. */
    }
  }

  /* ---------------------------------------------------------------------- */
  /* SVG-hjælpere                                                            */
  /* ---------------------------------------------------------------------- */

  const SVG_NS = 'http://www.w3.org/2000/svg';

  function el(tag, attrs, parent) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, value);
    if (parent) parent.appendChild(node);
    return node;
  }

  /** Lille deterministisk tilfældighedsgenerator, så stjernerne altid står ens. */
  function seededRandom(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const points = (list) => list.map((p) => p.join(',')).join(' ');

  /* ---------------------------------------------------------------------- */
  /* 1. Baggrund                                                             */
  /* ---------------------------------------------------------------------- */

  function drawScenery() {
    const defs = el('defs', {}, scenery);

    // Himmel
    const sky = el('linearGradient', { id: 'sky', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    el('stop', { offset: '0', 'stop-color': '#0A1733' }, sky);
    el('stop', { offset: '1', 'stop-color': '#1D3A6B' }, sky);

    // Varmt lys i vinduerne
    const glow = el('radialGradient', { id: 'windowGlow', cx: '50%', cy: '60%', r: '75%' }, defs);
    el('stop', { offset: '0', 'stop-color': '#FFE3A8' }, glow);
    el('stop', { offset: '0.6', 'stop-color': COLORS.warm }, glow);
    el('stop', { offset: '1', 'stop-color': '#E08A3A' }, glow);

    // Lysskær omkring lygter og måne
    const halo = el('radialGradient', { id: 'halo' }, defs);
    el('stop', { offset: '0', 'stop-color': COLORS.warm, 'stop-opacity': '0.45' }, halo);
    el('stop', { offset: '1', 'stop-color': COLORS.warm, 'stop-opacity': '0' }, halo);

    const moonHalo = el('radialGradient', { id: 'moonHalo' }, defs);
    el('stop', { offset: '0', 'stop-color': '#F6EFD9', 'stop-opacity': '0.35' }, moonHalo);
    el('stop', { offset: '1', 'stop-color': '#F6EFD9', 'stop-opacity': '0' }, moonHalo);

    // Let skygge nederst på facaderne
    const shade = el('linearGradient', { id: 'facadeShade', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    el('stop', { offset: '0', 'stop-color': '#000', 'stop-opacity': '0' }, shade);
    el('stop', { offset: '1', 'stop-color': '#000', 'stop-opacity': '0.28' }, shade);

    el('rect', { width: VIEW_W, height: VIEW_H, fill: 'url(#sky)' }, scenery);

    // Stjerner
    const rand = seededRandom(24);
    const stars = el('g', { fill: '#FFFFFF' }, scenery);
    for (let i = 0; i < 70; i += 1) {
      el('circle', {
        cx: (rand() * VIEW_W).toFixed(1),
        cy: (rand() * 380).toFixed(1),
        r: (0.6 + rand() * 1.4).toFixed(2),
        opacity: (0.25 + rand() * 0.55).toFixed(2),
      }, stars);
    }

    // Måne
    el('circle', { cx: 1470, cy: 105, r: 130, fill: 'url(#moonHalo)' }, scenery);
    el('circle', { cx: 1470, cy: 105, r: 36, fill: '#F6EFD9' }, scenery);

    // Fjerne tage i silhuet
    el('path', {
      d: 'M0 560 L60 520 L120 560 L120 500 L200 450 L280 500 L280 540 L340 540 L340 470 '
       + 'L420 430 L500 470 L560 470 L620 420 L700 470 L700 520 L780 480 L860 520 L940 460 '
       + 'L1020 500 L1080 440 L1160 500 L1240 470 L1320 510 L1320 450 L1400 410 L1480 450 '
       + 'L1540 500 L1600 470 L1600 900 L0 900 Z',
      fill: '#152E57',
    }, scenery);

    HOUSES.forEach((house, i) => drawHouse(house, HOUSE.firstX + i * HOUSE.spacing));

    // Lygter i mellemrummene
    for (let i = 0; i < HOUSES.length - 1; i += 1) {
      drawLamp(HOUSE.firstX + HOUSE.width + (HOUSE.spacing - HOUSE.width) / 2 + i * HOUSE.spacing);
    }

    // Grantræer i kanterne
    drawTree(55, 832);
    drawTree(1545, 832);

    // Finale: stjerne over husene, som tændes, når alle 24 låger er åbnet
    drawFinaleStar(800, 60);

    // Sne på jorden
    el('path', {
      d: 'M0 808 Q 200 790 400 806 T 800 804 T 1200 806 T 1600 800 L1600 900 L0 900 Z',
      fill: COLORS.snow,
    }, scenery);
    el('path', {
      d: 'M0 862 Q 300 846 620 860 T 1200 856 T 1600 858 L1600 900 L0 900 Z',
      fill: COLORS.snowShade,
      opacity: 0.6,
    }, scenery);
  }

  /** Julestjerne der først bliver synlig, når hele kalenderen er åbnet. */
  function drawFinaleStar(cx, cy) {
    const g = el('g', { id: 'finale' }, scenery);
    el('circle', { cx, cy, r: 90, fill: 'url(#halo)' }, g);
    const long = 46;
    const short = 17;
    const arms = [];
    for (let i = 0; i < 8; i += 1) {
      const angle = (Math.PI / 4) * i;
      const radius = i % 2 === 0 ? long : short;
      arms.push([
        (cx + Math.sin(angle) * radius).toFixed(1),
        (cy - Math.cos(angle) * radius).toFixed(1),
      ]);
    }
    el('polygon', { points: points(arms), fill: '#FFE7A8' }, g);
    el('circle', { cx, cy, r: 7, fill: '#FFFDF4' }, g);
    return g;
  }

  function drawHouse(house, x) {
    const c = COLORS[house.color];
    const w = HOUSE.width;
    const g = el('g', {}, scenery);

    // Gavl
    if (house.style === 'stepped') {
      const steps = [];
      const stepW = 30;
      const stepH = 26;
      let px = x;
      let py = HOUSE.top + 2;
      steps.push([px, py]);
      for (let s = 0; s < 4; s += 1) {
        py -= stepH; steps.push([px, py]);
        px += stepW; steps.push([px, py]);
      }
      py -= stepH; steps.push([px, py]);
      const peakRight = x + w - (px - x);
      steps.push([peakRight, py]);
      px = peakRight;
      for (let s = 0; s < 4; s += 1) {
        py += stepH; steps.push([px, py]);
        px += stepW; steps.push([px, py]);
      }
      steps.push([px, HOUSE.top + 2]);
      el('polygon', { points: points(steps), fill: c.facade }, g);

      // Sne på hvert trin (de vandrette stykker)
      const snowG = el('g', { stroke: COLORS.snow, 'stroke-width': 7, 'stroke-linecap': 'round' }, g);
      for (let k = 1; k < steps.length - 1; k += 1) {
        const [ax, ay] = steps[k];
        const [bx, by] = steps[k + 1];
        if (ay === by && bx !== ax) {
          el('line', { x1: ax + 2, y1: ay - 2, x2: bx - 2, y2: by - 2 }, snowG);
        }
      }
      drawRoundWindow(g, x + w / 2, 176, 18);
    } else {
      const peak = [x + w / 2, 112];
      el('polygon', {
        points: points([[x - 16, HOUSE.top + 12], peak, [x + w + 16, HOUSE.top + 12]]),
        fill: c.roof,
      }, g);
      el('polyline', {
        points: points([[x - 16, HOUSE.top + 7], [peak[0], peak[1] - 5], [x + w + 16, HOUSE.top + 7]]),
        fill: 'none', stroke: COLORS.snow, 'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      }, g);
      drawRoundWindow(g, x + w / 2, 200, 20);
    }

    // Facade, skygge og sokkel
    el('rect', { x, y: HOUSE.top, width: w, height: HOUSE.bottom - HOUSE.top, fill: c.facade }, g);
    el('rect', { x, y: HOUSE.top, width: w, height: HOUSE.bottom - HOUSE.top, fill: 'url(#facadeShade)' }, g);
    el('rect', { x, y: HOUSE.bottom - 36, width: w, height: 36, fill: c.plinth }, g);

    // Gesims
    el('rect', { x: x - 6, y: HOUSE.top, width: w + 12, height: 11, fill: COLORS.cream }, g);

    // Lyskæde under gesimsen
    drawLights(g, x + 14, x + w - 14, HOUSE.top + 20);

    // Vinduer (lågerne lægges ovenpå som HTML)
    WINDOW.rows.forEach((wy) => {
      WINDOW.colOffsets.forEach((dx) => drawWindow(g, x + dx, wy));
    });
  }

  function drawWindow(parent, wx, wy) {
    const { width: ww, height: wh } = WINDOW;
    el('rect', { x: wx - 7, y: wy - 7, width: ww + 14, height: wh + 14, rx: 3, fill: COLORS.cream }, parent);
    el('rect', { x: wx, y: wy, width: ww, height: wh, fill: 'url(#windowGlow)' }, parent);
    // Sprosser
    const bars = el('g', { stroke: '#8A5424', 'stroke-width': 3, opacity: 0.55 }, parent);
    el('line', { x1: wx + ww / 2, y1: wy, x2: wx + ww / 2, y2: wy + wh }, bars);
    el('line', { x1: wx, y1: wy + wh * 0.42, x2: wx + ww, y2: wy + wh * 0.42 }, bars);
    // Stearinlys i vindueskarmen – ses, når lågen er åbnet
    drawCandle(parent, wx + ww * 0.28, wy + wh - 8);
    // Karm med sne
    el('rect', { x: wx - 12, y: wy + wh + 6, width: ww + 24, height: 8, rx: 2, fill: COLORS.cream }, parent);
    el('rect', { x: wx - 10, y: wy + wh + 2, width: ww + 20, height: 6, rx: 3, fill: COLORS.snow }, parent);
  }

  /** Et enkelt stearinlys med flamme og lysskær. */
  function drawCandle(parent, x, baseY) {
    const g = el('g', {}, parent);
    el('circle', { cx: x, cy: baseY - 34, r: 16, fill: 'url(#halo)' }, g);
    el('rect', { x: x - 5, y: baseY - 30, width: 10, height: 30, rx: 2, fill: '#FFF6E2', opacity: 0.95 }, g);
    el('rect', { x: x - 8, y: baseY - 3, width: 16, height: 4, rx: 1.5, fill: '#C68C3A' }, g);
    el('path', {
      d: `M${x} ${baseY - 42} Q${x + 4} ${baseY - 35} ${x} ${baseY - 30} Q${x - 4} ${baseY - 35} ${x} ${baseY - 42} Z`,
      fill: '#FFEDBA',
    }, g);
    return g;
  }

  function drawRoundWindow(parent, cx, cy, r) {
    el('circle', { cx, cy, r: r + 5, fill: COLORS.cream }, parent);
    el('circle', { cx, cy, r, fill: 'url(#windowGlow)' }, parent);
    const bars = el('g', { stroke: '#8A5424', 'stroke-width': 2, opacity: 0.55 }, parent);
    el('line', { x1: cx - r, y1: cy, x2: cx + r, y2: cy }, bars);
    el('line', { x1: cx, y1: cy - r, x2: cx, y2: cy + r }, bars);
  }

  /** Lyskæde der hænger i små buer. */
  function drawLights(parent, x1, x2, y) {
    const spans = 5;
    const spanW = (x2 - x1) / spans;
    let d = `M${x1} ${y}`;
    for (let s = 0; s < spans; s += 1) {
      const sx = x1 + s * spanW;
      d += ` Q ${sx + spanW / 2} ${y + 12} ${sx + spanW} ${y}`;
    }
    el('path', { d, fill: 'none', stroke: '#2B1F14', 'stroke-width': 1.5, opacity: 0.7 }, parent);

    // Pærer: tre pr. bue, placeret på kurven
    for (let s = 0; s < spans; s += 1) {
      for (let k = 1; k <= 3; k += 1) {
        const t = k / 4;
        const bx = x1 + (s + t) * spanW;
        const by = y + 2 * t * (1 - t) * 12 + 3;
        el('circle', { cx: bx, cy: by, r: 8, fill: 'url(#halo)' }, parent);
        el('circle', { cx: bx, cy: by, r: 3, fill: COLORS.warm }, parent);
      }
    }
  }

  function drawLamp(cx) {
    const g = el('g', {}, scenery);
    el('circle', { cx, cy: 634, r: 80, fill: 'url(#halo)' }, g);
    el('rect', { x: cx - 3, y: 650, width: 6, height: 170, fill: COLORS.night }, g);
    el('rect', { x: cx - 9, y: 812, width: 18, height: 10, fill: COLORS.night }, g);
    el('polygon', { points: points([[cx - 14, 616], [cx + 14, 616], [cx + 10, 652], [cx - 10, 652]]), fill: COLORS.night }, g);
    el('rect', { x: cx - 8, y: 622, width: 16, height: 26, fill: COLORS.warm }, g);
    el('polygon', { points: points([[cx - 17, 616], [cx, 602], [cx + 17, 616]]), fill: COLORS.night }, g);
    el('line', { x1: cx - 17, y1: 613, x2: cx + 17, y2: 613, stroke: COLORS.snow, 'stroke-width': 4, 'stroke-linecap': 'round' }, g);
  }

  function drawTree(cx, baseY) {
    const g = el('g', {}, scenery);
    el('rect', { x: cx - 5, y: baseY - 30, width: 10, height: 30, fill: '#2B1D14' }, g);
    const tiers = [
      { w: 80, y: baseY - 30, h: 80 },
      { w: 64, y: baseY - 80, h: 70 },
      { w: 46, y: baseY - 125, h: 65 },
    ];
    tiers.forEach((t) => {
      el('polygon', {
        points: points([[cx - t.w / 2, t.y], [cx, t.y - t.h], [cx + t.w / 2, t.y]]),
        fill: COLORS.tree,
      }, g);
      // Snehætte på toppen af hvert lag
      const capH = t.h * 0.3;
      const capW = (t.w / 2) * 0.3;
      el('path', {
        d: `M${cx - capW} ${t.y - t.h + capH} L${cx} ${t.y - t.h} L${cx + capW} ${t.y - t.h + capH} `
         + `Q${cx} ${t.y - t.h + capH * 0.7} ${cx - capW} ${t.y - t.h + capH} Z`,
        fill: COLORS.snow,
      }, g);
    });
  }

  /* ---------------------------------------------------------------------- */
  /* 2. Låger                                                                */
  /* ---------------------------------------------------------------------- */

  const pct = (value, total) => `${(value / total) * 100}%`;

  function buildDoors() {
    HOUSES.forEach((house, h) => {
      const houseX = HOUSE.firstX + h * HOUSE.spacing;
      WINDOW.rows.forEach((wy, r) => {
        WINDOW.colOffsets.forEach((dx, c) => {
          const day = DOOR_ORDER[h * 6 + r * 2 + c];
          const door = document.createElement('button');
          door.type = 'button';
          door.className = 'door';
          door.dataset.day = String(day);
          door.dataset.house = house.color;
          door.style.left = pct(houseX + dx, VIEW_W);
          door.style.top = pct(wy, VIEW_H);
          door.style.width = pct(WINDOW.width, VIEW_W);
          door.style.height = pct(WINDOW.height, VIEW_H);
          door.innerHTML =
            `<span class="opened-num" aria-hidden="true">${day}</span>` +
            `<span class="shutter" aria-hidden="true"><span class="num">${day}</span></span>` +
            '<span class="opened-mark" aria-hidden="true"></span>';
          door.addEventListener('click', () => onDoorClick(day, door));
          doorsLayer.appendChild(door);
          doorEls.set(day, door);
        });
      });
    });
  }

  /** Opdaterer alle lågers tilstand ud fra dato og hvad brugeren har åbnet. */
  function applyDoorStates() {
    // Hele kalenderen åbnet? Så tændes finale-stjernen.
    $('stage').classList.toggle('is-complete', state.opened.size >= 24);
    doorEls.forEach((door, day) => {
      const unlocked = day <= state.today;
      const opened = unlocked && state.opened.has(day);
      door.classList.toggle('is-locked', !unlocked);
      door.classList.toggle('is-today', unlocked && day === state.today && state.today <= 24 && !opened);
      door.classList.toggle('is-opened', opened);
      door.setAttribute('aria-disabled', String(!unlocked));

      // Skærmlæsere får status med (vises ikke som tekst).
      let label = `Låge ${day}`;
      if (!unlocked) label += ', låst';
      else if (opened) label += ', åbnet';
      door.setAttribute('aria-label', label);
    });
  }

  /**
   * Piletaster flytter fokus mellem lågerne, som de står på husene.
   * Rækkefølgen findes ud fra lågernes faktiske placering, så den følger
   * automatisk med, hvis DOOR_ORDER eller husene ændres.
   */
  function setupKeyboardNav() {
    const byPosition = [...doorEls.values()].sort((a, b) => (
      parseFloat(a.style.top) - parseFloat(b.style.top)
      || parseFloat(a.style.left) - parseFloat(b.style.left)
    ));
    const perRow = HOUSES.length * WINDOW.colOffsets.length; // 8 låger pr. etage

    doorsLayer.addEventListener('keydown', (e) => {
      const steps = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: perRow, ArrowUp: -perRow };
      const index = byPosition.indexOf(document.activeElement);
      if (index < 0) return;

      let next = null;
      if (e.key in steps) next = byPosition[index + steps[e.key]];
      else if (e.key === 'Home') next = byPosition[0];
      else if (e.key === 'End') next = byPosition[byPosition.length - 1];
      else return;

      e.preventDefault();
      if (next) next.focus();
    });
  }

  function onDoorClick(day, door) {
    if (day > state.today) {
      // Låst: ryst lågen let.
      door.classList.remove('shake');
      void door.offsetWidth; // genstart animationen
      door.classList.add('shake');
      return;
    }

    state.lastFocus = door;

    if (state.opened.has(day)) {
      showCard(day);
      return;
    }

    state.opened.add(day);
    saveOpened();
    applyDoorStates();

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(() => showCard(day), reduced ? 0 : 750);
  }

  /* ---------------------------------------------------------------------- */
  /* Spørgsmålskort                                                          */
  /* ---------------------------------------------------------------------- */

  function showCard(day) {
    const question = state.questions[day] || '';
    $('cardNumber').textContent = String(day);
    // textContent (ikke innerHTML), så tekst fra admin aldrig tolkes som kode.
    $('cardQuestion').textContent = question;
    // Mangler spørgsmålet, vises en snefnug-vignet i stedet for tom plads.
    document.querySelector('.card').classList.toggle('is-empty', !question);
    cardLayer.hidden = false;
    $('cardClose').focus();
  }

  function hideCard() {
    if (cardLayer.hidden) return;
    cardLayer.hidden = true;
    if (state.lastFocus) state.lastFocus.focus();
  }

  $('cardClose').addEventListener('click', hideCard);
  cardLayer.addEventListener('click', (e) => {
    if (e.target === cardLayer) hideCard(); // klik uden for kortet
  });
  document.addEventListener('keydown', (e) => {
    if (cardLayer.hidden) return;
    if (e.key === 'Escape') hideCard();
    if (e.key === 'Tab') {
      e.preventDefault(); // hold fokus i kortet
      $('cardClose').focus();
    }
  });

  /* ---------------------------------------------------------------------- */
  /* Snefald                                                                 */
  /* ---------------------------------------------------------------------- */

  function makeSnow() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const layer = $('snow');
    const rand = seededRandom(1224);
    for (let i = 0; i < 36; i += 1) {
      const flake = document.createElement('span');
      const size = 0.18 + rand() * 0.32; // i cqw
      flake.className = 'flake';
      flake.style.width = `${size}cqw`;
      flake.style.height = `${size}cqw`;
      flake.style.left = `${rand() * 100}%`;
      flake.style.opacity = (0.25 + rand() * 0.4).toFixed(2);
      flake.style.animationDuration = `${12 + rand() * 14}s`;
      flake.style.animationDelay = `${-rand() * 26}s`;
      flake.style.setProperty('--drift', `${(rand() * 4 - 2).toFixed(2)}cqw`);
      layer.appendChild(flake);
    }
  }

  /* ---------------------------------------------------------------------- */
  /* 3. Dato og spørgsmål                                                    */
  /* ---------------------------------------------------------------------- */

  /**
   * Spørgsmålene ligger som base64-kodet JSON i QUESTIONS_DATA (øverst i
   * filen), så de ikke kan læses direkte ved et hurtigt kig i kildekoden.
   * Det er en bremse – ikke kryptering.
   */
  function decodeQuestions(encoded) {
    if (!encoded) return {};
    try {
      const bytes = Uint8Array.from(atob(encoded), (ch) => ch.charCodeAt(0));
      const data = JSON.parse(new TextDecoder().decode(bytes));
      return data && typeof data === 'object' ? data : {};
    } catch (err) {
      console.warn('Julekalender: spørgsmålsdata kunne ikke læses', err);
      return {};
    }
  }

  /**
   * Returnerer antallet af låger, der må åbnes i dag:
   *   0      før 1. december
   *   1–24   i december (1. dec = låge 1 osv.; efter 24. dec forbliver det 24)
   *   24     efter kalenderåret
   * Datoen beregnes i dansk tid, uanset hvor brugeren befinder sig.
   */
  function unlockedDoorCount() {
    let year;
    let month;
    let day;

    if (CALENDAR_SETTINGS.testDate) {
      [year, month, day] = CALENDAR_SETTINGS.testDate.split('-').map(Number);
    } else {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit',
      }).formatToParts(new Date());
      const pick = (type) => Number(parts.find((p) => p.type === type).value);
      year = pick('year');
      month = pick('month');
      day = pick('day');
    }

    if (year < YEAR || (year === YEAR && month < 12)) return 0;
    if (year === YEAR && month === 12) return Math.min(day, 24);
    return 24;
  }

  /** Opdaterer dagens dato og lågernes tilstand. */
  function refresh() {
    state.today = unlockedDoorCount();
    applyDoorStates();
  }

  /* ---------------------------------------------------------------------- */
  /* Start                                                                   */
  /* ---------------------------------------------------------------------- */

  drawScenery();
  buildDoors();
  setupKeyboardNav();
  applyDoorStates();
  makeSnow();
  refresh();

  // Åbn nye låger automatisk, hvis siden står åben hen over midnat.
  setInterval(refresh, REFRESH_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refresh();
  });
})();
  </script>
</body>
